{% load static %}
<nav class="app-header navbar navbar-expand-lg px-3 px-lg-4">
  <div class="app-header-inner container-fluid px-0">
    <button class="btn btn-outline-secondary d-lg-none" type="button" data-bs-toggle="offcanvas" data-bs-target="#mobileSidebar" aria-controls="mobileSidebar" aria-label="Abrir navegación">
      <i class="bi bi-list"></i>
    </button>
    <div class="header-brand ms-2 ms-lg-0">
      <img class="header-logo" src="{% static 'img/capital-logo-encabezado.png' %}" alt="Capital Medical Center">
    </div>
    <div class="header-actions ms-auto d-flex align-items-start justify-content-end">
      {% if request.user.is_authenticated %}
        <div class="logged-user-box">
          <span class="logged-user-label">Usuario</span>
          <span class="logged-user-name">{{ request.user.get_full_name|default:request.user.email }}</span>
        </div>
      {% else %}
        <a class="btn btn-sm btn-primary" href="{% url 'login' %}">
          <i class="bi bi-box-arrow-in-right me-1"></i>
          Ingresar
        </a>
      {% endif %}
    </div>
  </div>
</nav>
