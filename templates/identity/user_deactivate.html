{% extends "base.html" %}

{% block content %}
  <section class="status-panel p-3 p-lg-4">
    <div class="d-flex flex-column flex-md-row align-items-md-center justify-content-between gap-3 mb-4">
      <div>
        <p class="text-uppercase text-secondary small fw-semibold mb-2">Usuario</p>
        <h1 class="h4 mb-0">Desactivar usuario</h1>
      </div>
      <a class="btn btn-outline-secondary" href="{% url 'user_detail' managed_user.pk %}">
        <i class="bi bi-arrow-left me-1"></i>
        Volver
      </a>
    </div>

    <div class="alert alert-warning" role="alert">
      ¿Deseas desactivar el usuario {{ managed_user.email }}? No se borrará físicamente.
    </div>
    <form method="post">
      {% csrf_token %}
      <div class="d-flex justify-content-end gap-2">
        <a class="btn btn-outline-secondary" href="{% url 'user_detail' managed_user.pk %}">Cancelar</a>
        <button class="btn btn-danger" type="submit">Desactivar</button>
      </div>
    </form>
  </section>
{% endblock %}
