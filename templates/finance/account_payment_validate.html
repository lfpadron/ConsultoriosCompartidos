{% extends "base.html" %}

{% block content %}
  <section class="status-panel p-3 p-lg-4"><p class="text-uppercase text-secondary small fw-semibold mb-2">Validación</p><h1 class="h4 mb-2">{{ page_title }}</h1><p>Se aplicarán <strong>{{ account_payment.amount }} {{ account_payment.currency }}</strong> al estado de cuenta.</p><form method="post">{% csrf_token %}<div class="d-flex justify-content-end gap-2"><a class="btn btn-outline-secondary" hx-boost="false" href="{% url 'account_statement_detail' account_payment.account_statement_id %}">Volver</a><button class="btn btn-primary" type="submit"><i class="bi bi-check2-circle me-1"></i>Validar pago</button></div></form></section>
{% endblock %}
