{% extends "base.html" %}

{% block content %}
  <section class="status-panel p-3 p-lg-4"><p class="text-uppercase text-secondary small fw-semibold mb-2">Validación</p><h1 class="h4 mb-2">{{ page_title }}</h1><p class="text-secondary">{{ account_payment }}</p><form method="post" novalidate>{% csrf_token %}{% if form.non_field_errors %}<div class="alert alert-danger">{{ form.non_field_errors }}</div>{% endif %}<div class="mb-3"><label class="form-label" for="{{ form.reason.id_for_label }}">{{ form.reason.label }}</label>{{ form.reason }}{% for error in form.reason.errors %}<div class="invalid-feedback d-block">{{ error }}</div>{% endfor %}</div><div class="d-flex justify-content-end gap-2"><a class="btn btn-outline-secondary" hx-boost="false" href="{% url 'account_statement_detail' account_payment.account_statement_id %}">Volver</a><button class="btn btn-warning" type="submit"><i class="bi bi-x-octagon me-1"></i>Rechazar pago</button></div></form></section>
{% endblock %}
